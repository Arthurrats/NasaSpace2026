name: vigia-terra

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5

  research:
    profiles: [research]
    build: ./research
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./research/notebooks:/workspace/notebooks
    networks: [research]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8888/lab', timeout=3).close()"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  research:
