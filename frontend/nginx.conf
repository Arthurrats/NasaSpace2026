map $uri $query_limit_key {
    default "";
    ~^/api/(summary|fires|activity|map/(foci|timeline))$ $binary_remote_addr;
}

map $uri $tile_limit_key {
    default "";
    ~^/api/map/tiles/ $binary_remote_addr;
}

map $uri $territory_limit_key {
    default "";
    /api/map/territories $binary_remote_addr;
}

limit_req_zone $query_limit_key zone=api_queries:10m rate=10r/s;
limit_req_zone $tile_limit_key zone=map_tiles:10m rate=40r/s;
limit_req_zone $territory_limit_key zone=territories:10m rate=2r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        client_max_body_size 8m;
        limit_req zone=api_queries burst=20 nodelay;
        limit_req zone=map_tiles burst=100 nodelay;
        limit_req zone=territories burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_hide_header X-Content-Type-Options;
        # Resolve the service again when Compose recreates the backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:5000;
        proxy_pass http://$backend;
    }

    location @rate_limited {
        default_type application/json;
        expires -1;
        return 429 '{"error":{"code":"rate_limited","message":"Muitas requisições. Tente novamente em instantes."}}';
    }
}
