server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Resolve the service again when Compose recreates the backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:5000;
        proxy_pass http://$backend;
    }
}
